  claim: "Live Xero sync is ready for the pilot."
  quote: "**Live sync is planned, and doesn't exist yet** (roadmap.md §1)."
  quote_ref: status.md §2
  expect: block
  why: "T10 and T24. The quote says the opposite: planned, not built."

- id: RP18
  kind: negation
  claim: "Live Xero sync is not ready: it's planned and doesn't exist yet."
  quote: "**Live sync is planned, and doesn't exist yet** (roadmap.md §1)."
  quote_ref: status.md §2
  expect: pass
  why: "T10 and T24, the correct reply. Same quote as RP17; a reviewer that blocks on the word 'not' fails here."

- id: RP19
  kind: negation
  claim: "Live Xero sync is already part of what the pilot gets."
  quote: "Xero is CSV export for now; live sync is phase 2 as well."
  quote_ref: led-017
  expect: block
