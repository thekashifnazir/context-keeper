  claim: "GoCardless direct debit is live."
  quote: "**GoCardless direct debit** (shipped-untested): sandbox only. A live test is booked for 17 Nov."
  quote_ref: status.md §2
  expect: block
  why: "RT-HAI-2. 'live' appears only in 'a live test is booked'; the label is shipped-untested, sandbox only."

- id: RP21
