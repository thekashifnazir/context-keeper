# ledgerly-pilot: Context Keeper demo room. GENERATED by `npm run seed -- --emit-templates` from
# prompts/room-rules.md and demo/ledgerly/ — edit those, not this file.
#
# The main route is the seed command (`npm run seed -- --bridge <app>`), which also does what a
# template cannot. If you import this in Console (Templates → Import template) instead:
#   - turn on join events for context-keeper in the room (Notify on join), or the late-joiner brief never fires;
#   - documents made by a template belong to you, not the agent. That is fine for these; the agent
#     creates its own "Decision log" when it starts;
#   - make the owner desk yourself: a private channel with only you and context-keeper.
# No kickoff: on purpose (Switch #1158: on Mattermost a kickoff card retries forever).
params:
  room_name:
    type: string
    default: "ledgerly-pilot"
    description: The room (and channel) name
  bridge:
    type: bridge
    default: [$first]
    description: The messaging app the room lives on
room:
  name: "{room_name}"
  description: "Ledgerly pilot planning. Context Keeper points people at what the room already decided, with a cited source."
  instructions: |
    In this room, the agent must always:
    - Tell apart settled decisions, open questions, personal preferences and binding constraints.
    - Cite where and when a decision was made, plus the reasoning behind it.
    - Use a respectful, brief tone, but flag a repeated idea.
    - Record clear agreements, including the owner, the date and the follow-ups.
    - Stay silent during ordinary social chatter unless asked.

    And must never:
    - Shame, correct or talk down to someone for revisiting an idea.
    - Treat a personal preference as a team-wide constraint.
    - Claim a decision exists without a source.
    - Reopen a settled decision without new information or an explicit request.
    - Turn chatter into tasks, decisions or summaries.

    Room owner: {$creator} (only this person confirms decisions or rules on clashes, in the owner desk).
  bridge: "{bridge}"
  channel_type: channel_public
  agents: [context-keeper]
  users: ["{$creator}"]
  docs:
    - name: "Ledgerly pilot plan"
      description: "Ledgerly pilot plan (seeded project document, pilot-plan.md)"
      instructions: "A project document. Cite it by its name and section number (for example §3), quoting it word for word."
      content: |
        # Ledgerly pilot plan

        Owner: Kash. Last updated Fri 30 Oct 2026. Status: **committed**. The partners have signed their pilot letters, and the dates are booked.

        ## §1 What and when
        - A two-week pilot from **Tue 24 Nov to Fri 4 Dec 2026**.
        - **Three partner agencies:** Fieldnote Studio, Harbour & Pine and Northbank Creative. All three signed their pilot letters by 30 Oct.
        - Free during the pilot, then £19 per user per month (see D6 in §2).

        ## §2 Decisions (each confirmed by Kash, with the reason)

        Each record: status (proposed / confirmed / superseded / parked), the decision, why, the options we rejected and why, the downside we accepted, and **when to reopen it**.

        | # | Status | Decision | Why | Rejected (and why) | Downside accepted | Reopen if | Source |
        |---|---|---|---|---|---|---|---|
        | D1 | confirmed | Onboarding calls on **weekdays, Tue to Thu** | Partner finance staff work weekdays only; support is staffed on weekdays | Weekends (no support cover); Mondays (month-end close at two partners) | Owners who'd prefer a weekend have to fit a weekday slot | A partner **can't make any Tue–Thu slot** | `led-011` |
        | D2 | confirmed | **Three agencies, max 25 clients each** | Support is Priya plus Kash; three keeps the loop tight; one is too small to learn from | One agency (too small a sample); five (support can't cope) | Waiting-list agencies wait until 2027 | Support capacity changes (a new hire) | `led-012` |
        | D3 | confirmed | Pilot currencies **GBP, EUR and USD** | Northbank bills two US clients | GBP only (loses Northbank's US clients) | USD has open issue #41 | #41 isn't fixed by 20 Nov | `led-013` |
        | D4 | confirmed | **Customer interviews before the pilot**, not a survey | 12 agencies interviewed in Sep; surveys only hear from people who already want the thing | A mailing-list survey (selection bias) | Slower than a survey | Never for this pilot (already done) | `led-008` |
        | D5 | confirmed | **No public launch until the pilot ends** | We want results before self-serve sign-up | Launch alongside the pilot (no learning first) | No public buzz in Nov | The pilot ends early | `led-014` |
        | D6 | confirmed | Price after the pilot: **£19 per user per month** | Mid-range of what the interviewed agencies pay | £12 (undervalues it); £28 (top of range, no track record) | Some small agencies may balk | Pilot feedback says price is the blocker | `led-015` |

        ## §3 Who does what
        - Kash: partner relationships and final decisions.
        - Priya: onboarding calls and pilot support.
        - Sam: the invoice template polish for the pilot.
        - Rowan: partner comms from 4 Nov (back from leave).

        ## §4 Open asks (help wanted)
        - A **case-study write-up** template for after the pilot.
        - **Two more agencies** for a waiting list, in case a partner drops out.
        - Someone to own the **pilot feedback form**.
    - name: "Ledgerly: product overview"
      description: "Ledgerly: product overview (seeded project document, product.md)"
      instructions: "A project document. Cite it by its name and section number (for example §3), quoting it word for word."
      content: |
        # Ledgerly: product overview

        Owner: Kash. Last updated 20 Oct 2026.

        Ledgerly is invoicing and payment chasing for small agencies (2 to 30 people). It turns tracked time into invoices, chases late payers politely, and takes payment.

        ## §1 Invoices
        - Create invoices from tracked time entries or line items.
        - Recurring invoices: weekly, monthly or quarterly.
        - Currencies: GBP, EUR and USD.
        - **Editable templates:** every label on the invoice (such as "Invoice", "Due date" and "Total") can be renamed per client. There is no built-in translation.
        - Each invoice is sent as a PDF and a secure link.

        ## §2 Payment reminders
        - Automatic reminders at 3, 7 and 14 days overdue (each one can be switched off).
        - Three tone presets: friendly, neutral and firm.
        - Reminders can be paused per client (for example during a dispute).
        - Shipped in v0.6 (12 Aug 2026).

        ## §3 Payments
        - Card payments through Stripe.
        - **Direct debit through GoCardless**, so agencies avoid card fees on large invoices.
        - Partial payments, with the balance tracked on the invoice.

        ## §4 Integrations
        - **Xero: CSV export only.** Live two-way sync is planned for phase 2 (see roadmap.md §1).
        - Slack notification when an invoice is paid.

        ## §5 Client portal
        - Each client gets a portal listing all their invoices.
        - Clients can download PDFs and payment receipts, and update their billing contact.

        ## §6 Security
        - Two-factor sign-in for all users.
        - Data is stored in the UK (London region).
        - SSO isn't available yet (see roadmap.md §1).

        ## §7 Deliberately not doing
        - **A native mobile app.** The web app is fully responsive. Decided 9 Sep, because agencies invoice from a desk and two codebases would halve our speed (see `led-006`).
        - **Crypto payments.** No customer has asked for them, and they add compliance work.
    - name: "Ledgerly: customer research summary"
      description: "Ledgerly: customer research summary (seeded project document, research.md)"
      instructions: "A project document. Cite it by its name and section number (for example §3), quoting it word for word."
      content: |
        # Ledgerly: customer research summary

        Owner: Kash. Interviews: 1 to 25 Sep 2026. Last updated Mon 28 Sep 2026.

        ## §1 Method
        - **12 agency interviews** of 30 minutes each, with owners or finance leads at agencies of 2 to 30 people.
        - **No survey.** People who answer surveys already want the thing, so the answers skew (decision D4).

        ## §2 What we heard
        - 10 of 12 chase late payments by hand, and it's the most-hated admin task. (This led to the reminders in product.md §2.)
        - 7 of 12 named card fees on large invoices as a pain. (This led to GoCardless in product.md §3.)
        - 9 of 12 use Xero; 2 use QuickBooks; 1 uses a spreadsheet.
        - None asked for a mobile app.
        - Their tools cost between £12 and £28 per user per month today.
    - name: "Ledgerly roadmap"
      description: "Ledgerly roadmap (seeded project document, roadmap.md)"
      instructions: "A project document. Cite it by its name and section number (for example §3), quoting it word for word."
      content: |
        # Ledgerly roadmap

        Owner: Kash. Last updated 28 Oct 2026.

        ## §1 Phase 2 (after the pilot, from Jan 2027): parked, not rejected
        - **QuickBooks integration.** Two of the 12 interviewed agencies use it. Parked so the pilot stays on Xero CSV users (`led-016`).
        - **Live two-way Xero sync** (today it's a CSV export; see product.md §4).
        - **SSO** (Google and Microsoft sign-in).
        - **Self-serve sign-up** (after D5 in the pilot plan).
        - **A public launch event** for agencies.

        ## §2 Not planned
        - A native mobile app (see product.md §7).
        - Crypto payments (see product.md §7).
    - name: "Ledgerly: pilot readiness status"
      description: "Ledgerly: pilot readiness status (seeded project document, status.md)"
      instructions: "A project document. Cite it by its name and section number (for example §3), quoting it word for word."
      content: |
        # Ledgerly: pilot readiness status

        Owner: Priya. Last updated Mon 2 Nov 2026.

        Labels: **shipped-tested**, **shipped-untested**, **in-progress**, **planned**, **not-planned**. Check the label before telling a partner something works.

        ## §1 shipped-tested (tested with real partner data)
        - Invoices from time entries, and recurring invoices (product.md §1)
        - Payment reminders, all three tones (product.md §2)
        - Stripe card payments (product.md §3)
        - The client portal (product.md §5)

        ## §2 shipped-untested, in-progress or planned
        - **GoCardless direct debit** (shipped-untested): sandbox only. A live test is booked for 17 Nov.
        - **USD invoices** (shipped-untested): a rounding issue on partial payments is open (issue #41).
        - **Xero:** CSV export is shipped-tested. **Live sync is planned, and doesn't exist yet** (roadmap.md §1).

        ## §3 Known issues
        - #41: a USD partial payment can be off by 1 cent on the remaining balance.
        - #44: the PDF logo is blurry on some templates (Sam is on it).
