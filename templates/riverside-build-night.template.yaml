# riverside-build-night: Context Keeper demo room. GENERATED by `npm run seed -- --emit-templates` from
# prompts/room-rules.md and demo/riverside/ — edit those, not this file.
#
# The main route is the seed command (`npm run seed -- --bridge <app>`), which also does what a
# template cannot. If you import this in Console (Templates → Import template) instead:
#   - turn on join events for context-keeper in the room (Notify on join), or the late-joiner brief never fires;
#   - documents made by a template belong to you, not the agent. That is fine for these; the agent
#     creates its own "Decision log" when it starts;
#   - make the owner desk yourself: a private channel with only you and context-keeper.
# No kickoff: on purpose (Switch #1158: on Mattermost a kickoff card retries forever).
params:
  room_name:
    type: string
    default: "riverside-build-night"
    description: The room (and channel) name
  bridge:
    type: bridge
    default: [$first]
    description: The messaging app the room lives on
room:
  name: "{room_name}"
  description: "Riverside Build Night organisers. Context Keeper points people at what the room already decided, with a cited source."
  instructions: |
    In this room, the agent must always:
    - Tell apart settled decisions, open questions, personal preferences and binding constraints.
    - Cite where and when a decision was made, plus the reasoning behind it.
    - Use a respectful, brief tone, but flag a repeated idea.
    - Record clear agreements, including the owner, the date and the follow-ups.
    - Stay silent during ordinary social chatter unless asked.

    And must never:
    - Shame, correct or talk down to someone for revisiting an idea.
    - Treat a personal preference as a team-wide constraint.
    - Claim a decision exists without a source.
    - Reopen a settled decision without new information or an explicit request.
    - Turn chatter into tasks, decisions or summaries.

    Room owner: {$creator} (only this person confirms decisions or rules on clashes, in the owner desk).
  bridge: "{bridge}"
  channel_type: channel_public
  agents: [context-keeper]
  users: ["{$creator}"]
  docs:
    - name: "Riverside Build Night #1: event plan"
      description: "Riverside Build Night #1: event plan (seeded project document, event-plan.md)"
      instructions: "A project document. Cite it by its name and section number (for example §3), quoting it word for word."
      content: |
        # Riverside Build Night #1: event plan

        Organiser and owner: Kash. Last updated Mon 2 Nov 2026, 12:45. Status: **committed**. The sponsor and venue are confirmed, and the date is booked.

        ## §1 Format
        - **Thu 26 Nov 2026, 18:30 to 21:30**, an evening build night.
        - **Capacity of 45.** Tickets need approval: people give a reason for coming, and we approve in batches. Free events usually see about half of sign-ups turn up, so approvals run to 60.
        - Open to **the whole local tech community**, not only students.
        - Food arrives at **20:00**, not at the start, so people stay through the build.

        ## §2 Decisions (with reasons)

        | # | Status | Decision | Why | Rejected (and why) | Reopen if | Source |
        |---|---|---|---|---|---|---|
        | E1 | confirmed | **Weekday evening, not a weekend** | First small pilot event; a weekend needs bigger sponsors and cuts out people with family or weekend jobs | A weekend (parked to §4) | A sponsor funds a full weekend | `riv-004` |
        | E2 | confirmed | **No pre-event survey** | Surveys only hear from people who already want X | A survey to the mailing list | Never for event #1 | `riv-006` |
        | E3 | confirmed | **Community-wide, not students-only** | The venue's programme is for everyone; student no-show rates are high | Students-only (parked to §4) | The uni society co-hosts a separate night | `riv-008` |
        | E4 | confirmed | **Two tracks: Open Build and Business Challenge** | The Business Challenge gives local businesses a reason to come | One open track (no business draw) | No business sets a challenge by 19 Nov | `riv-005` |

        ## §3 Sponsor and venue
        - **Patchwork** (a dev tool) gives every attendee free Pro access for the night. Confirmed 2 Nov.
        - **Venue:** the Riverside co-working space, hosted by Dana. Confirmed 2 Nov.

        ## §4 Later events (parked, not rejected)
        - **A full weekend hackathon**, once we have a bigger sponsor and a community to draw on.
        - **A students-only event** with the university society.

        ## §5 Open asks (help wanted)
        - A **food sponsor** (Patchwork can cover up to £300 as a fallback).
        - **Prizes** for both tracks.
        - **Two mentors** on the night.
    - name: "Channel archive"
      description: "The channel history before the live demo, with message ids (chat apps cannot backdate messages)."
      instructions: "The dated record of what was said in this room before now. Each message has an id (such as led-007), an author, a time and its text; `thread` is the id of the message it replies to. Cite a message by author, date and id, quoting it word for word."
      content: |
        # Seeded history for #riverside-build-night (invented). The organisers' channel.
        room: riverside-build-night
        owner: Kash
        docs: [docs/event-plan.md]
        members: [Kash, Dana]   # Alex joins on 3 Nov, which triggers the late-joiner brief (job C)
        messages:
          - id: riv-001
            at: 2026-10-12T19:00:00+01:00
            author: Kash
            text: "Set up this channel for Build Night #1. Plan doc is in the room docs."
          - id: riv-002
            at: 2026-10-12T19:20:00+01:00
            author: Dana
            text: "Happy to host. Our community programme is open to everyone, so no students-only nights from us."
          - id: riv-003
            at: 2026-10-14T20:05:00+01:00
            author: Dana
            text: "Would a weekend give people more time to build?"
          - id: riv-004
            at: 2026-10-14T20:30:00+01:00
            author: Kash
            thread: riv-003
            text: "Decision E1: weekday evening for this one. It's a first small pilot. A weekend needs a bigger sponsor and cuts out people with families or weekend jobs. Weekend version is parked for later."
          - id: riv-005
            at: 2026-10-16T18:40:00+01:00
            author: Kash
            text: "Decision E4: two tracks, Open Build and Business Challenge. Local businesses set the challenge problems."
          - id: riv-006
            at: 2026-10-19T21:10:00+01:00
            author: Kash
            text: "Decision E2: no pre-event survey. Surveys only hear from people who already want X."
          - id: riv-007
            at: 2026-10-22T18:15:00+01:00
            author: Dana
            text: "Could we pull in the uni computing society?"
          - id: riv-008
            at: 2026-10-22T18:50:00+01:00
            author: Kash
            thread: riv-007
            text: "Decision E3: they're welcome, but this one is community-wide, not students-only. A students-only night with the society is parked for later."
          - id: riv-009
            at: 2026-11-02T12:30:00+00:00
            author: Kash
            text: "Patchwork confirmed: free Pro access for every attendee, plus up to £300 for food if we can't find a food sponsor. Venue confirmed with Dana. Date locked: Thu 26 Nov."
          - id: riv-010
            at: 2026-11-02T12:45:00+00:00
            author: Kash
            text: "Still need: a food sponsor, prizes for both tracks, and two mentors. Shout if you know anyone."
          - id: riv-011
            at: 2026-11-02T13:10:00+00:00
            author: Dana
            text: "Heads up: the venue kitchen shuts at 20:00 on Thursdays, so food has to land by 19:30."
          - id: riv-012
            at: 2026-11-02T13:25:00+00:00
